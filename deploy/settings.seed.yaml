# Seeded into ~/.dsh/settings.yaml on first boot when that file does not exist.
# Registers the two local bridges as providers. Edit in the UI afterwards; the
# volume keeps your changes and this file is never applied again.
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
llm-pi-ai:
  providers:
    agy:
      displayName: Antigravity CLI (agy)
      api: openai-completions
      baseURL: http://127.0.0.1:8001/v1
      apiKeyEnv: AGY_API_KEY
      defaultInput:
        - text
        - image
      models:
        - id: gemini-3.8-flash-high
          name: Gemini 3.8 Flash (High)
          contextWindow: 1048576
          maxTokens: 65536
          input: [ text, image ]
        - id: gemini-3.8-flash-medium
          name: Gemini 3.8 Flash (Medium)
          contextWindow: 1048576
          maxTokens: 65536
          input: [ text, image ]
        - id: gemini-3.8-flash-low
          name: Gemini 3.8 Flash (Low)
          contextWindow: 1048576
          maxTokens: 65536
          input: [ text, image ]
        - id: gemini-3.7-flash-high
          name: Gemini 3.7 Flash (High)
          contextWindow: 1048576
          maxTokens: 65536
          input: [ text, image ]
        - id: gemini-3.7-flash-medium
          name: Gemini 3.7 Flash (Medium)
          contextWindow: 1048576
          maxTokens: 65536
          input: [ text, image ]
        - id: gemini-3.7-flash-low
          name: Gemini 3.7 Flash (Low)
          contextWindow: 1048576
          maxTokens: 65536
          input: [ text, image ]
        - id: gemini-3.6-flash-high
          name: Gemini 3.6 Flash (High)
          contextWindow: 1048576
          maxTokens: 65536
          input: [ text, image ]
        - id: gemini-3.6-flash-medium
          name: Gemini 3.6 Flash (Medium)
          contextWindow: 1048576
          maxTokens: 65536
          input: [ text, image ]
        - id: gemini-3.6-flash-low
          name: Gemini 3.6 Flash (Low)
          contextWindow: 1048576
          maxTokens: 65536
          input: [ text, image ]
        - id: gemini-3.1-pro-high
          name: Gemini 3.1 Pro (High)
          contextWindow: 1048576
          maxTokens: 65536
          input: [ text, image ]
        - id: gemini-3.1-pro-low
          name: Gemini 3.1 Pro (Low)
          contextWindow: 1048576
          maxTokens: 65536
          input: [ text, image ]
        - id: claude-sonnet-4-6
          name: Claude Sonnet 4.6 (Thinking)
          contextWindow: 200000
          maxTokens: 64000
