# Browser control, layered over the shipped Web composition.
#
# The bridge rides the UI web server rather than its own realm: a browser
# extension must reach it on the same origin and port the operator already
# trusts, and it authenticates its own caller with a token in the upgrade URL.
- insert:
    - id: browser-bridge
      # Referenced by path, not by package name: this package is fork-local and
      # unpublished, so a profile's pnpm install cannot fetch it and a bare name
      # resolves to nothing. The Loader then skips the row and the upgrade route
      # never exists, which reaches a browser only as a 502 on the handshake.
      name: '../../packages/host/browser-bridge/lib/index.js'
      config:
        # `||`, not `??`: Compose sets every declared variable, so an unset
        # DSH_BROWSER_BRIDGE_PATH arrives as '' rather than undefined, and `??`
        # would keep it — registering the route on the empty path.
        path: !!js process.env.DSH_BROWSER_BRIDGE_PATH || '/browser-bridge'
        token: !!js process.env.DSH_BROWSER_BRIDGE_TOKEN ?? ''
