# Dokploy control, layered over the shipped Web composition.
#
# Referenced by path because this package is fork-local and unpublished. The
# servers live in the `dokploy` user-settings namespace (Settings -> dokploy),
# never here. The command-route token, when set, exposes the tools to the agy
# and opencode CLIs over MCP; empty leaves that route unmounted (direct-provider
# agents still get the tools natively).
- insert:
    - id: dokploy
      name: '../../packages/host/dokploy/lib/index.js'
      config:
        path: !!js process.env.DSH_DOKPLOY_PATH || '/dokploy'
        token: !!js process.env.DSH_DOKPLOY_TOKEN || ''
