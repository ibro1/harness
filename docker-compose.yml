# DeepSeek Harness on Dokploy.
#
# Deploy as a Docker Compose application. Set the variables from
# deploy/.env.example in Dokploy's Environment panel — nothing secret belongs
# in this file.
#
# Before the first deploy, on the Dokploy host:
#   mkdir -p /opt/harness/bin /opt/harness/workspace
#   scp agy opencode  ->  /opt/harness/bin/   (chmod 755)
#   see deploy/README.md for the agy OAuth token

services:
  harness:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        # Only build metadata shown in the UI. Set it to the deployed commit if
        # you want the build label to identify the source revision.
        DSH_CLIENT_COMMIT_HASH: ${DSH_CLIENT_COMMIT_HASH:-0000000}
    restart: unless-stopped
    # No `ports:` on purpose. The only way in is Traefik, so the login page is
    # the only public surface and the bridges stay on container loopback.
    environment:
      DSH_PUBLIC_HOST: ${DSH_PUBLIC_HOST:?set DSH_PUBLIC_HOST}
      DSH_EXTRA_TRUSTED_HOSTS: ${DSH_EXTRA_TRUSTED_HOSTS:-}
      DSH_AUTH_USER: ${DSH_AUTH_USER:-admin}
      DSH_AUTH_PASSWORD: ${DSH_AUTH_PASSWORD:-}
      DSH_AUTH_PASSWORD_HASH: ${DSH_AUTH_PASSWORD_HASH:-}
      DSH_AUTH_API_TOKEN: ${DSH_AUTH_API_TOKEN:-}
      DSH_SESSION_TTL_HOURS: ${DSH_SESSION_TTL_HOURS:-168}
      DSH_TRUST_PROXY: "1"
      DSH_AUTH_COOKIE_SECURE: auto
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-}
      GIT_TOKEN: ${GIT_TOKEN:-}
      GIT_TOKEN_USER: ${GIT_TOKEN_USER:-}
      GIT_HOST: ${GIT_HOST:-}
      DSH_GITHUB_WEBHOOK_SECRET: ${DSH_GITHUB_WEBHOOK_SECRET:-}
      DSH_GITHUB_REPOSITORIES: ${DSH_GITHUB_REPOSITORIES:-}
      DSH_GITHUB_WORKSPACE_ROOT: ${DSH_GITHUB_WORKSPACE_ROOT:-/workspace}
      DSH_GITHUB_TRIGGER: ${DSH_GITHUB_TRIGGER:-}
      DSH_GITHUB_ALLOWED_ASSOCIATIONS: ${DSH_GITHUB_ALLOWED_ASSOCIATIONS:-}
      DSH_GITHUB_AGENT_PRESET: ${DSH_GITHUB_AGENT_PRESET:-}
      DSH_GITHUB_PERMISSION_PRESET: ${DSH_GITHUB_PERMISSION_PRESET:-}
      # Browser control. Empty leaves the bridge unmounted; see deploy/README.md.
      DSH_BROWSER_BRIDGE_TOKEN: ${DSH_BROWSER_BRIDGE_TOKEN:-}
      DSH_BROWSER_BRIDGE_PATH: ${DSH_BROWSER_BRIDGE_PATH:-}
      DSH_GITHUB_WEBHOOK_PUBLIC_PORT: ${DSH_GITHUB_WEBHOOK_PUBLIC_PORT:-}
      # 0 withdraws the browser tools from the agy CLI, and with them the
      # --dangerously-skip-permissions grant that admits them.
      DSH_BROWSER_MCP: ${DSH_BROWSER_MCP:-}
    volumes:
      # Harness state: sessions, settings.yaml, provider credentials, attachments.
      - dsh-state:/home/node/.dsh
      # agy's identity. antigravity-oauth-token lives here and must survive
      # redeploys, or every deploy costs you another browser login.
      - agy-state:/home/node/.gemini
      - opencode-config:/home/node/.config/opencode
      - opencode-state:/home/node/.local/share/opencode
      # The agy / opencode binaries, supplied from the host.
      - /opt/harness/bin:/opt/harness/bin
      # Where agents actually work. Anything here is reachable by the agent.
      - /opt/harness/workspace:/workspace
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.harness.rule=Host(`${DSH_PUBLIC_HOST}`)
      # Named explicitly: Traefik only infers a router's service when the
      # container defines exactly one, and the webhook ingress adds a second.
      - traefik.http.routers.harness.service=harness
      - traefik.http.routers.harness.entrypoints=websecure
      - traefik.http.routers.harness.tls=true
      - traefik.http.routers.harness.tls.certresolver=letsencrypt
      - traefik.http.services.harness.loadbalancer.server.port=3080
      # /github reaches the ingress realm, never the UI server. Higher priority
      # than the catch-all Host rule so the path wins.
      - traefik.http.routers.harness-webhook.rule=Host(`${DSH_PUBLIC_HOST}`) && Path(`/github`)
      - traefik.http.routers.harness-webhook.priority=100
      - traefik.http.routers.harness-webhook.entrypoints=websecure
      - traefik.http.routers.harness-webhook.tls=true
      - traefik.http.routers.harness-webhook.tls.certresolver=letsencrypt
      - traefik.http.routers.harness-webhook.service=harness-webhook
      # Must match DSH_GITHUB_WEBHOOK_PUBLIC_PORT in deploy/entrypoint.sh.
      - traefik.http.services.harness-webhook.loadbalancer.server.port=3083
      - traefik.http.routers.harness.middlewares=harness-ratelimit@docker,harness-headers@docker
      # Second line of defence on the login page; the app rate-limits per
      # address as well, but this one costs the attacker the TCP handshake.
      - traefik.http.middlewares.harness-ratelimit.ratelimit.average=60
      - traefik.http.middlewares.harness-ratelimit.ratelimit.burst=120
      - traefik.http.middlewares.harness-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.harness-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.harness-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.harness-headers.headers.referrerPolicy=no-referrer

volumes:
  dsh-state:
  agy-state:
  opencode-config:
  opencode-state:

networks:
  dokploy-network:
    external: true
